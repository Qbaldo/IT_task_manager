{% extends "base.html" %}

{% block content %}
  <h1>
    Workers list
  </h1>
  <ul>
    {% for worker in workers %}
      <li>
        <a href="{% url 'worker-detail' worker.id %}">
          {{ worker.username }} - {{ worker.first_name }} {{ worker.last_name }}
        </a>
      </li>
    {% empty %}
      <li>No workers yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
