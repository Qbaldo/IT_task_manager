{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h1>Dashboard</h1>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Użytkownicy</h5>
                    <p class="card-text display-4">{{ users_count }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Zadania</h5>
                    <p class="card-text display-4">{{ tasks_count }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
