{% extends "base.html" %}

{% block content %}
  <h1>
    Task List
  </h1>
  <a href="{% url 'task-create' %}" class="btn btn-primary mb-3">Add Worker</a>
  <ul>
    {% for task in tasks %}
      <li>
        <a href="{% url 'task-detail' task.id %}">
          {{ task.name }}
        </a>
      </li>
    {% empty %}
      <li>No tasks yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
