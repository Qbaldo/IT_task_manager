{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1>
        🏷 Task Types
    </h1>

    <a href="{% url 'task-type-create' %}"
       class="btn btn-primary">
        + Add Task Type
    </a>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <table class="table table-hover mb-0">

            <thead>
                <tr>
                    <th>Name</th>
                    <th class="text-end">Action</th>
                </tr>
            </thead>


            <tbody>

            {% for tasktype in task_type %}

                <tr>

                    <td>
                        {{ tasktype.name }}
                    </td>


                    <td class="text-end">

                        <a href="{% url 'task-type-delete' tasktype.pk %}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('Na pewno?');">

                            Delete

                        </a>

                    </td>

                </tr>

            {% empty %}

                <tr>
                    <td colspan="2" class="text-center text-muted">
                        No Task Types yet.
                    </td>
                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
